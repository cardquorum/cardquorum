services:
  postgres:
    image: postgres:18-alpine
    container_name: cardquorum-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: cardquorum
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cardquorum
    volumes:
      - pgdata-dev:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cardquorum']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata-dev:
