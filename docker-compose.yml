services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cardquorum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: cardquorum
    volumes:
      - pgdata-prod:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardquorum"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - 3000:3000
    environment:
      - DATABASE_URL=postgresql://cardquorum:${POSTGRES_PASSWORD:-changeme}@db:5432/cardquorum
      - NODE_ENV
      - AUTH_STRATEGIES
      - LOG_LEVEL
      - OIDC_ISSUER
      - OIDC_CLIENT_ID
      - OIDC_CLIENT_SECRET
      - OIDC_REDIRECT_URI
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata-prod:
