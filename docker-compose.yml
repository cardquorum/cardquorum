services:
  app:
    image: ghcr.io/reednel/cardquorum:main
    container_name: cardquorum-app
    ports: 3000:3000
    env_file: .env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    container_name: cardquorum-db
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    volumes:
      - cq-data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cardquorum}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cq-data:
